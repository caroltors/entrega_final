{% extends "knowledge/base.html" %}
{% block title %}Senha alterada — Base de Conhecimento{% endblock %}

{% block extra_head %}
<style>
  .kb-auth-card{max-width:520px;margin:32px auto;border:1px solid var(--kb-border);border-radius:12px;}
  .kb-auth-card .card-body{padding:28px;}
  .btn-main{
    background: var(--kb-dark); color:#fff; font-weight:500; border-radius:6px;
    padding:.5rem 1rem; border:none; transition:background .2s;
  }
  .btn-main:hover{ background:#1a243b; color:#fff; text-decoration:none; }
</style>
{% endblock %}

{% block content %}
<div class="card kb-auth-card shadow-sm">
  <div class="card-body text-center">
    <h1 class="h4 mb-2">Senha alterada com sucesso 🎉</h1>
    <p class="text-muted mb-4">Da próxima vez que entrar, use sua nova senha.</p>
    <a href="{% url 'accounts:profile' %}" class="btn btn-main">Voltar ao perfil</a>
  </div>
</div>
{% endblock %}
